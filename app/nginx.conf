server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress everything text-shaped, including proxied /api JSON (gzip_proxied) — the Electric
    # transaction shape alone is ~4.5MB of JSON per fresh app open, and the budget route chunk was
    # ~530KB of JS; both shrink ~3-4x on the wire. Each Electric long-poll delivers a complete
    # response body, so compressing proxied replies does not break live shapes. min_length skips the
    # tiny shape control responses.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css text/javascript image/svg+xml;

    # Everything under /api (including /api/electric/* shapes) proxies to the api container. Electric shapes
    # are long-lived long-polls, so buffering is OFF and read timeouts are long — otherwise a live shape
    # stalls behind nginx's default 60s/buffering. The api itself strips hop-by-hop headers before this.
    #
    # ⚠️ Upstream is the CONTAINER NAME `kumbara-api`, NOT the compose service alias `api`. This is THE fix for
    # the recurring "host not found in upstream api" / 502 after pressing Update in the Cosmos UI. Cosmos's
    # per-container Update recreates one container at a time and does NOT re-apply the compose network aliases,
    # so afterwards `docker inspect kumbara-api` shows Aliases:null and `api` returns NXDOMAIN. (Explicit
    # `networks.aliases` in the compose file do NOT survive a Cosmos recreate — verified: freshly-Updated
    # containers come back with Aliases:null regardless.) The container_name, by contrast, is registered in
    # Docker's DNSNames from `--name`, which EVERY recreate re-establishes, so `kumbara-api` always resolves.
    # Verified live 2026-07-10 from inside this container: `getent hosts api` -> nothing, `getent hosts
    # kumbara-api` -> 172.22.0.4. Electric shapes flow through this same /api path (the api proxies /api/electric).
    location /api/ {
        # Resolve the upstream LAZILY, at request time, via Docker's embedded DNS (127.0.0.11 on any
        # user-defined network). Two things this buys us, both load-bearing:
        #   1. A bare `proxy_pass http://kumbara-api:4000` resolves ONCE at startup and nginx `[emerg]`-exits
        #      (crashloop) if the name isn't in DNS yet during the boot window.
        #   2. More importantly, the api gets a NEW ip on every recreate. A static proxy_pass would cache the
        #      dead pre-recreate ip and 502 until nginx reload; a variable upstream re-resolves per request so
        #      it picks up the new ip within `valid` seconds. THIS is why we keep the resolver even now that the
        #      name (kumbara-api) is durable — the durable name fixes NXDOMAIN, the lazy resolve fixes the ip.
        #
        # valid=1s: a variable proxy_pass re-resolves per request, but the resolver core caches the answer for
        # `valid`. nginx's `valid` caps NEGATIVE (NXDOMAIN) answers too, not just positive ones (verified in
        # ngx_resolver.c 1.27.0: negative TTL = `r->valid ? r->valid : 10`). So any transient miss during the
        # api's ~3s recreate window self-heals in ~1s instead of sticking as a 502 storm. Cost is ~1 extra
        # embedded-DNS query/sec/worker — negligible. proxy_next_upstream does NOT cover resolve failures (the
        # 502 fires before any peer is selected), so a low `valid` + resolver_timeout is the only lever here.
        # resolver_timeout 3s: fail fast if 127.0.0.11 is briefly unresponsive instead of hanging 30s.
        # ipv6=off: the api is IPv4-only; skip the AAAA lookup Docker answers NXDOMAIN for.
        resolver 127.0.0.11 valid=1s ipv6=off;
        resolver_timeout 3s;
        set $api_upstream http://kumbara-api:4000;
        # $request_uri keeps the full original path+query (matches the old no-URI proxy_pass, which passed the
        # request unchanged). The api owns the /api/* routes, so no prefix is stripped.
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The OIDC login flow (/auth/login, /auth/callback, /auth/logout) lives on the API, not the SPA. Without
    # this it would fall through to `location /` and serve index.html (HTTP 200) instead of 302-ing to the
    # IdP, so login silently breaks. Same container-name upstream + lazy-resolve proxy as /api/ (only /auth/ —
    # the app's client-side routes are elsewhere, so this prefix is unambiguous).
    location /auth/ {
        resolver 127.0.0.11 valid=1s ipv6=off;
        resolver_timeout 3s;
        set $auth_upstream http://kumbara-api:4000;
        proxy_pass $auth_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: hashed assets get long-cache; everything else falls through to index.html for client routing.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
