<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v= is a cache-buster: browsers cache favicons in a separate, very sticky store that ignores normal
         reloads, so an old placeholder icon survives a redeploy. Bump this integer whenever an icon changes. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <!-- viewport-fit=cover is what activates env(safe-area-inset-*); without it those values
         resolve to 0 and the safe-area handling in the floating pill-nav / FABs is inert on notched devices. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Kumbara</title>
    <meta name="description" content="Self-hosted, single-household budgeting and transaction tracking" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0c0c0c" />

    <!-- iOS PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kumbara" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192.png?v=2" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-192.png?v=2" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-192.png?v=2" />

      <link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
