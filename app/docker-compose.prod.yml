# Production stack for the Pi, discovered by Cosmos via the labels below.
#
# ⚠️  On the Pi the app runs index.prod.ts, which binds the REAL SimpleFIN sources (R9). The agent may
#     build/run this stack locally against a synthetic DB to verify; R9 forbids binding a real token or
#     reading the deployed prod URL, not building or running the code path offline. ⚠️
#
# Only the app is published to the host; postgres/electric talk over the compose network. The app serves the
# web app and /api from one port, so web + API are one origin (Electric shapes included).
#
# This is the Pi's own stack (Cosmos labels, container names, port 5182). What other people install is
# docker-compose.selfhost.yml, published as kumbara-stack.
#
# Deploy: publish a release → GitHub Actions builds+pushes amd64+arm64 images to ghcr AND publishes THIS FILE as an
# OCI artifact (ghcr.io/armanckeser/kumbara-pi:<tag>) → on the Pi
# `docker compose -f oci://ghcr.io/armanckeser/kumbara-pi:X.Y.Z up -d -y` (see DEPLOY.md). Nothing is
# rsynced; the compose file is versioned with the images it expects. The app service carries both
# `image:` (pull from ghcr) and `build:` (source fallback if the registry is unreachable).
#
# Secrets are NOT read from server/.env here — see the app service. They arrive as ${VAR} interpolation
# from the deploy directory's .env (~/kumbara/.env on the Pi), which is the durable owner of the auth vars.

# Pin the project name. Compose normally derives it from the directory basename, but an oci:// source has
# no project directory, so the name would silently depend on whichever CWD you invoke from. The real volume
# names are <project>_kumbara-pgdata / -electricdata: deploying under any other project name creates NEW
# EMPTY volumes and orphans the live ones. The existing stack was created as `kumbara` — do not change this.
name: kumbara

services:
  postgres:
    image: postgres:16-alpine
    container_name: kumbara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    # Logical replication is what Electric's shapes ride on (same flags as dev).
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - kumbara-pgdata:/var/lib/postgresql/data
    labels:
      - "cosmos-stack=kumbara"

  electric:
    image: electricsql/electric:1.7.6
    container_name: kumbara-electric
    restart: unless-stopped
    environment:
      # Host is the CONTAINER NAME (kumbara-postgres), not the compose service alias `postgres`: a Cosmos
      # per-container Update drops the service alias but never the container_name. See the app service.
      DATABASE_URL: postgresql://postgres:password@kumbara-postgres:5432/app?sslmode=disable
      # Insecure is acceptable: electric is never host-published, reachable only via the app's /api/electric
      # proxy on the internal network, behind Cosmos auth.
      ELECTRIC_INSECURE: "true"
      ELECTRIC_STORAGE_DIR: /var/lib/electric/persistent
    volumes:
      - kumbara-electricdata:/var/lib/electric/persistent
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "cosmos-stack=kumbara"

  app:
    # PULL from ghcr if the image exists (the normal path: CI built it on release), else BUILD from source
    # (offline / registry-down fallback). One image serves the web app and the API on :8080 (SERVE_WEB=1),
    # so there is no nginx container any more.
    image: ghcr.io/armanckeser/kumbara:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kumbara-app
    restart: unless-stopped
    # No env_file (incompatible with the oci:// deploy; see the header). Secrets arrive as ${VAR} from
    # ~/kumbara/.env. SESSION_SECRET, the Web Push keys and OIDC_AUTH_SECRET are generated on first boot
    # into instance_secret (server/boot.ts) when left unset here.
    environment:
      DATABASE_URL: postgresql://postgres:password@kumbara-postgres:5432/app
      ELECTRIC_URL: http://kumbara-electric:3000
      TLS_CERT_FILE: ""
      TLS_KEY_FILE: ""
      SYNC_INTERVAL_MINUTES: "1440"
      AUTH_ENABLED: ${AUTH_ENABLED:-0}
      OIDC_ISSUER: ${OIDC_ISSUER:-https://cosmos.example.com}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-kumbara}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-https://kumbara.example.com/auth/callback}
      OIDC_AUTH_EXTERNAL_URL: ${OIDC_AUTH_EXTERNAL_URL:-https://kumbara.example.com}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile offline}
      OIDC_AUTH_REFRESH_INTERVAL: ${OIDC_AUTH_REFRESH_INTERVAL:-604800}
      OIDC_AUTH_EXPIRES: ${OIDC_AUTH_EXPIRES:-2592000}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_AUTH_SECRET: ${OIDC_AUTH_SECRET:-}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-}
    ports:
      # Cosmos routes kumbara.example.com to http://kumbara-app:8080.
      - target: 8080
        published: "5182"
    depends_on:
      postgres:
        condition: service_healthy
      electric:
        condition: service_started
    labels:
      - "cosmos-stack=kumbara"
      - "cosmos-stack-main=kumbara-app"
      - "cosmos-icon=https://api.iconify.design/lucide:piggy-bank.svg?color=%23f4a259"

volumes:
  kumbara-pgdata:
  kumbara-electricdata:
